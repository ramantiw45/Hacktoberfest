services:
  - type: web
    name: foliage-walk-planner
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: MODEL_ID
        value: Qwen/Qwen2.5-7B-Instruct
      - key: MODEL_PROVIDER
        value: hf-inference
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
